<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | BloodConnect</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar"><a class="brand" href="index.html"><span class="brand-mark"><span>+</span></span>BloodConnect</a><a class="btn btn-ghost" href="login.html">Already registered?</a></nav></header><main class="form-layout"><div><span class="eyebrow">Join the network</span><h1>There is room for your kind of help.</h1><p class="lead">Choose how you want to take part. You can update your profile and availability any time.</p></div><form class="form-panel" data-demo-form data-success="Registration complete. Your profile is ready for verification."><div class="form-grid"><div class="field full"><label for="account">I want to register as</label><select id="account"><option>Donor</option><option>Blood seeker</option></select></div><div class="field"><label for="name">Full name</label><input id="name" required></div><div class="field"><label for="phone">Mobile</label><input id="phone" required></div><div class="field full"><label for="email">Email</label><input id="email" type="email" required></div><div class="field"><label for="city">City</label><input id="city" placeholder="Pune" required></div><div class="field"><label for="group">Blood group</label><select id="group"><option>O+</option><option>O−</option><option>A+</option><option>A−</option><option>B+</option><option>B−</option><option>AB+</option><option>AB−</option></select></div><div class="field full"><label for="password">Create password</label><input id="password" type="password" required></div></div><div class="form-footer"><span class="form-message" hidden></span><button class="btn btn-primary" type="submit">Create profile ↗</button></div></form></main><script src="js/script.js"></script></body></html>
