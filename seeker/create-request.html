<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create request | BloodConnect</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><nav class="navbar"><a class="brand" href="../index.html"><span class="brand-mark"><span>+</span></span>BloodConnect</a><div class="nav-links"><a href="seeker-dashboard.html">Dashboard</a><a class="active" href="create-request.html">Create request</a><a href="my-requests.html">My requests</a></div></nav></header><main class="form-layout"><div><span class="eyebrow">New request</span><h1>Tell the network what is needed.</h1><p class="lead">Your request will be matched with verified donors based on blood group and location.</p></div><form class="form-panel" data-demo-form data-success="Request sent to matching donors."><div class="form-grid"><div class="field"><label>Patient name</label><input required></div><div class="field"><label>Blood group</label><select><option>O+</option><option>A+</option><option>B+</option></select></div><div class="field"><label>Units</label><input type="number" min="1" value="2"></div><div class="field"><label>Required date</label><input type="date" required></div><div class="field full"><label>Hospital</label><input placeholder="Hospital name" required></div><div class="field"><label>City</label><input value="Pune"></div><div class="field"><label>Urgency</label><select><option>Emergency</option><option>Within 24 hours</option><option>Planned</option></select></div></div><div class="form-footer"><span class="form-message" hidden></span><button class="btn btn-primary" type="submit">Send request ↗</button></div></form></main><script src="../js/script.js"></script></body></html>
