<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create request | BloodConnect</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar"><a class="brand" href="index.html"><span class="brand-mark"><span>+</span></span>BloodConnect</a><a class="btn btn-ghost" href="find-blood.html">Back to search</a></nav></header><main class="form-layout"><div><span class="eyebrow">Blood request</span><h1>Give donors what they need to respond.</h1><p class="lead">Clear details help verified donors coordinate quickly with your hospital.</p><div class="notice">For emergencies, also contact your hospital or local emergency service directly.</div></div><form class="form-panel" data-demo-form data-success="Request sent. Matching donors have been notified."><div class="form-grid"><div class="field"><label for="patient">Patient name</label><input id="patient" required></div><div class="field"><label for="group">Blood group</label><select id="group"><option>O+</option><option>O−</option><option>A+</option><option>B+</option></select></div><div class="field"><label for="units">Units required</label><input id="units" type="number" min="1" value="2" required></div><div class="field"><label for="date">Required date</label><input id="date" type="date" required></div><div class="field full"><label for="hospital">Hospital / blood bank</label><input id="hospital" placeholder="CityCare Hospital" required></div><div class="field"><label for="city">City</label><input id="city" value="Pune" required></div><div class="field"><label for="urgency">Urgency</label><select id="urgency"><option>Emergency</option><option>Within 24 hours</option><option>Planned</option></select></div></div><div class="form-footer"><span class="form-message" hidden></span><button class="btn btn-primary" type="submit">Send request ↗</button></div></form></main><script src="js/script.js"></script></body></html>
